[project]
name = "types-confluent-kafka"
version = "0.1.0"
description = "Partial typing stubs for confluent-kafka"
readme = "README.md"
authors = [
    { name = "Kun Yang" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["confluent-kafka", "kafka", "stubs", "typing", "pyright"]
requires-python = ">=3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Stubs Only",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/agnos-one/types-confluent-kafka"
Repository = "https://github.com/agnos-one/types-confluent-kafka"
Issues = "https://github.com/agnos-one/types-confluent-kafka/issues"
Changelog = "https://github.com/agnos-one/types-confluent-kafka/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "confluent_kafka-stubs"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
reportUnnecessaryTypeIgnoreComment = "error"
# No extra paths: by default pyright adds `src` as one, merges the partial stub package it finds there into the
# installed library, and no longer checks the stub files as sources. For the same reason pyright runs on a
# non-editable install (see CLAUDE.md).
executionEnvironments = [{ root = ".", extraPaths = [] }]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
combine-as-imports = true

[dependency-groups]
dev = [
    "confluent-kafka[avro,json,protobuf,schemaregistry]==2.16.2",
    "types-protobuf>=6.30.0",
    "mypy>=1.20.0",
    "pyright>=1.1.414",
    "ruff>=0.17.6",
]

# Only for stubtest (`--mypy-config-file pyproject.toml`). confluent-kafka ships its own types, so mypy
# analyzes the library's modules along with the stubs, and stubtest stops on the errors mypy finds in them.
[[tool.mypy.overrides]]
module = ["confluent_kafka.*"]
ignore_errors = true
